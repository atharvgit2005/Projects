[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-orchestrator"
version = "0.1.0"
description = "External orchestration wrapper and closed-loop controller for Google Antigravity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "google-antigravity>=0.1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:cli"
wrapper = "orchestrator.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
